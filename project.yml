name: SmartShot
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
options:
  bundleIdPrefix: com.harkhowalia
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
targets:
  SmartShot-iOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
        excludes: ["AppIcon.icon"]
      - path: Shared/AppIcon.icon
        type: file
        buildPhase: resources
    info:
      path: Resources/iOS-Info.plist
      properties:
        CFBundleDisplayName: SmartShot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        NSCameraUsageDescription: SmartShot uses the camera to take photos.
        NSPhotoLibraryAddUsageDescription: SmartShot saves your photos to your library.
        NSPhotoLibraryUsageDescription: SmartShot shows your photos so you can view, favorite, edit and share them.
    settings:
      base:
        PRODUCT_NAME: SmartShot
        PRODUCT_BUNDLE_IDENTIFIER: com.harkhowalia.smartshot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
  SmartShot-macOS:
    type: application
    platform: macOS
    sources:
      - path: Shared
        excludes: ["AppIcon.icon"]
      - path: Shared/AppIcon.icon
        type: file
        buildPhase: resources
    entitlements:
      path: Resources/macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.camera: true
        com.apple.security.personal-information.photos-library: true
        com.apple.security.assets.pictures.read-write: true
    info:
      path: Resources/macOS-Info.plist
      properties:
        CFBundleDisplayName: SmartShot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.photography
        NSCameraUsageDescription: SmartShot uses the camera to take photos.
        NSPhotoLibraryAddUsageDescription: SmartShot saves your photos to your library.
        NSPhotoLibraryUsageDescription: SmartShot shows your photos so you can view, favorite, edit and share them.
    settings:
      base:
        PRODUCT_NAME: SmartShot
        PRODUCT_BUNDLE_IDENTIFIER: com.harkhowalia.smartshot.mac
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "-"
